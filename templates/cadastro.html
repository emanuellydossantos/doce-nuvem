
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Doce Nuvem</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="cartao">
        <h1>Doce Nuvem</h1>
        <p class="subtitulo">Crie sua conta e venha adoçar seu dia!</p>

        <h2>Criar conta</h2>

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensagem in mensagens %}
                <p class="mensagem {{ categoria }}">{{ mensagem }}</p>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('cadastro') }}" method="post">
            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                required
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                name="senha"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <label for="confirmacao">Confirme sua senha</label>
            <input
                type="password"
                id="confirmacao"
                name="confirmacao"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <button type="submit">Criar conta</button>
        </form>

        <p style="text-align: center; margin-top: 20px;">
            Já tem uma conta?
            <a href="{{ url_for('login') }}">Entrar</a>
        </p>
    </main>
</body>
</html>
